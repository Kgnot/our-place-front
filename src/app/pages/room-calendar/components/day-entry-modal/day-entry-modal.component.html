<app-modal [isOpen]="isOpen()" title="Recuerdo del {{ selectedDate() }}" (closeModal)="closeModal.emit()">

  @if (dayDetail()) {
    <div class="existing-entry">
      <p class="entry-content">{{ dayDetail()?.content }}</p>
      <div class="photo-grid">
        @for (media of dayDetail()?.mediaIds; track media.id) {
          <img [src]="media.thumbnailUrl" class="entry-photo"/>
        }
      </div>
    </div>
  } @else {
    <p class="text-muted">Aún no hay recuerdos en este día. ¡Escribe uno!</p>
  }

  <hr class="divider"/>

  <div class="form-group">
    <label>Añadir comentario o nota</label>
    <textarea
      class="form-control"
      rows="3"
      [ngModel]="newNoteContent()"
      (ngModelChange)="noteContentChange.emit($event)"
      placeholder="¿Qué pasó este día?"
    ></textarea>
  </div>

  <button type="button" class="upload-btn" (click)="uploadPhotoClick.emit()">
    <span class="material-symbols-outlined">add_a_photo</span>
    Subir foto
  </button>

  <div modal-footer>
    <button class="btn btn-outlined" (click)="closeModal.emit()">Cancelar</button>
    <button class="btn btn-primary" (click)="save.emit()" [disabled]="isSaving()">
      {{ isSaving() ? 'Guardando...' : 'Guardar Nota' }}
    </button>
  </div>
</app-modal>
