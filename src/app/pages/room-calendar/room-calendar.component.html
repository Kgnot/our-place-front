<app-room-header/>

<main class="calendar-main">
  <app-calendar-pane
    [monthLabel]="monthLabel()"
    [weekDays]="weekDays"
    [blankDaysCount]="blankDaysCount()"
    [days]="calendarDays()"
    (previousMonth)="previousMonth()"
    (nextMonth)="nextMonth()"
    (todayClick)="goToToday()"
    (dayClick)="openDayModal($event)"
  />

  <app-month-photos-pane
    [monthLabel]="months[viewDate().getMonth()]"
    [photos]="monthPhotos()"
  />
</main>

<app-day-entry-modal
  [isOpen]="isModalOpen()"
  [selectedDate]="selectedDate()"
  [dayDetail]="selectedDayDetail()"
  [newNoteContent]="newNoteContent()"
  [isSaving]="isSaving()"
  (closeModal)="closeModal()"
  (save)="saveNote()"
  (noteContentChange)="newNoteContent.set($event)"
  (uploadPhotoClick)="isUploadOpen.set(true)"
/>
