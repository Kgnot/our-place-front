<div class="noise-overlay"></div>
<app-room-header />

<div class="feed-layout">
  <main class="feed-main">
    <div class="masonry-grid">
      <div class="masonry-item add-card-masonry">
        <div class="add-card-inner" (click)="isAddNoteOpen.set(true)">
          <div class="add-icon"><span class="material-symbols-outlined">edit_note</span></div>
          <h3>Escribir un recuerdo</h3>
          <p>Deja una nota de amor.</p>
        </div>
      </div>

      @for (media of mediaItems(); track media.id) {
        <article class="masonry-item">
          <app-feed-media-card [media]="media" [roomId]="roomId()" (openViewer)="selectedMedia.set($event)" />
        </article>
      }

      @for (note of notes(); track note.id) {
        <article class="masonry-item">
          <app-feed-note-card [note]="note" />
        </article>
      }
    </div>
  </main>

  <div class="dashed-divider-v"></div>
  <aside>
    <app-pets-rail [pets]="pets()" (addPet)="isAddPetOpen.set(true)" (selectPet)="goToPet($event)" />
  </aside>
</div>

<button class="fab-btn" (click)="isUploadOpen.set(true)">
  <span class="material-symbols-outlined">add_a_photo</span>
  <span class="fab-text">Agregar fotos</span>
</button>

<!-- MODALES (Súper limpios, solo Inputs y Outputs) -->
<app-upload-photos-modal
  [isOpen]="isUploadOpen()"
  [roomId]="roomId()"
  (closeModal)="isUploadOpen.set(false)"
  (uploadComplete)="onUploadComplete($event)"
/>

<app-add-note-modal
  [isOpen]="isAddNoteOpen()"
  [roomId]="roomId()"
  (closeModal)="isAddNoteOpen.set(false)"
  (noteCreated)="onNoteCreated($event)"
/>

<!-- Modal de Mascotas (Lo dejamos aquí porque es cortito) -->
<app-modal [isOpen]="isAddPetOpen()" title="Agregar mascota" (closeModal)="isAddPetOpen.set(false)">
  <div class="form-group">
    <label>Nombre</label>
    <input type="text" class="form-control" [(ngModel)]="petForm.name" placeholder="Nombre de la mascota" />
  </div>
  <div class="form-group">
    <label>Especie</label>
    <select class="form-control" [(ngModel)]="petForm.speciesCode">
      <option value="" disabled selected>Selecciona una especie</option>
      @for (sp of species(); track sp.code) {
        <option [value]="sp.code">{{ sp.name }}</option>
      }
    </select>
  </div>
  <div class="form-group">
    <label>Raza (opcional)</label>
    <input type="text" class="form-control" [(ngModel)]="petForm.breed" placeholder="Raza" />
  </div>
  <div class="form-group">
    <label>Fecha de nacimiento (opcional)</label>
    <input type="date" class="form-control" [(ngModel)]="petForm.birthDate" />
  </div>
  <div modal-footer>
    <button class="btn btn-outlined" (click)="isAddPetOpen.set(false)" [disabled]="isSavingPet()">Cancelar</button>
    <button class="btn btn-primary" (click)="savePet()" [disabled]="isSavingPet() || !petForm.name.trim() || !petForm.speciesCode">Guardar</button>
  </div>
</app-modal>

<!-- VISOR DE FOTOS -->
@if (selectedMedia()) {
  <app-photo-viewer-modal
    [isOpen]="true"
    [media]="selectedMedia()"
    [roomId]="roomId()"
    (closeModal)="selectedMedia.set(null)"
  />
}
