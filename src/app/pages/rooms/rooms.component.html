<div class="noise-overlay"></div>

<app-header />

<main class="op-main">
  <div class="page-intro">
    <h2>Tus Espacios</h2>
    <p>Elige un room para entrar, o empieza una nueva colección de recuerdos.</p>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <p>Cargando tus espacios...</p>
    </div>
  } @else {
    <div class="rooms-grid">
      @for (room of rooms(); track room.roomId) {
        <app-room-card
          [room]="room"
          (openRoom)="openRoom($event)"
          (leaveRoom)="leaveRoom($event)"
        />
      }

      <!-- TARJETA CREAR (SIEMPRE VISIBLE) -->
      <div class="create-card" (click)="openModal()">
        <div class="create-inner">
          <div class="create-icon">
            <span class="material-symbols-outlined">add</span>
          </div>
          <h3>Crear un nuevo espacio</h3>
          <p>Empieza un nuevo diario compartido.</p>
        </div>
      </div>
    </div>
  }
</main>

<app-create-room-modal
  [isOpen]="isModalOpen()"
  [relationshipTypes]="relationshipTypes()"
  [isSaving]="isSaving()"
  (saveRoom)="saveRoom($event)"
  (closeModal)="closeModal()"
/>
